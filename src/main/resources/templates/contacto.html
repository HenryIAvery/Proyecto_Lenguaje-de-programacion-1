<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Vinyl House - Contacto</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-dark text-white p-5">
    <div class="container">
      <!-- HEADER -->

      <header class="text-center mb-5">
        <h1 class="display-4 fw-bold text-warning">🎵 VINYL HOUSE</h1>

        <p class="lead text-light">
          ¿Buscas un álbum específico o necesitas ayuda con tu pedido?
        </p>

        <nav class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
          <a th:href="@{/}" class="btn btn-outline-light btn-sm"> Inicio </a>

          <a th:href="@{/catalogo}" class="btn btn-outline-light btn-sm">
            Catálogo
          </a>

          <a th:href="@{/categorias}" class="btn btn-outline-light btn-sm">
            Categorías
          </a>

          <a th:href="@{/ofertas}" class="btn btn-outline-light btn-sm">
            Ofertas
          </a>

          <a
            th:href="@{/contacto}"
            class="btn btn-warning btn-sm text-dark fw-bold"
          >
            Contacto
          </a>

          <a th:href="@{/carrito}" class="btn btn-outline-warning btn-sm">
            Mi Carrito 🛒
          </a>
        </nav>

        <hr class="border-warning mt-4" />
      </header>

      <!-- FORMULARIO -->

      <div class="row justify-content-center">
        <div class="col-md-7">
          <div class="card bg-secondary text-white border-0 shadow p-4">
            <h3 class="mb-4 text-center text-warning fw-bold">
              📬 Contacta con Vinyl House
            </h3>

            <p class="text-center text-light opacity-75 mb-4">
              Envíanos tus consultas sobre disponibilidad, pedidos, ediciones
              especiales o recomendaciones musicales.
            </p>

            <!-- MENSAJES -->

            <div
              th:if="${mensajeExito}"
              class="alert alert-success text-center fw-bold"
              th:text="${mensajeExito}"
            ></div>

            <div
              th:if="${error}"
              class="alert alert-danger text-center"
              th:text="${error}"
            ></div>

            <!-- FORM -->

            <form
              th:action="@{/contacto/enviar}"
              th:object="${contacto}"
              method="POST"
            >
              <div class="mb-3">
                <label for="nombre" class="form-label fw-bold text-warning">
                  Nombre
                </label>

                <input
                  type="text"
                  th:field="*{nombre}"
                  id="nombre"
                  class="form-control bg-dark text-white border-secondary"
                  placeholder="Tu nombre completo"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label fw-bold text-warning">
                  Correo Electrónico
                </label>

                <input
                  type="email"
                  th:field="*{correo}"
                  id="correo"
                  class="form-control bg-dark text-white border-secondary"
                  placeholder="ejemplo@email.com"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="asunto" class="form-label fw-bold text-warning">
                  Asunto
                </label>

                <input
                  type="text"
                  th:field="*{asunto}"
                  id="asunto"
                  class="form-control bg-dark text-white border-secondary"
                  placeholder="Consulta sobre un álbum"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="mensaje" class="form-label fw-bold text-warning">
                  Mensaje
                </label>

                <textarea
                  th:field="*{mensaje}"
                  id="mensaje"
                  rows="5"
                  class="form-control bg-dark text-white border-secondary"
                  placeholder="Escribe aquí tu consulta..."
                  required
                >
                </textarea>
              </div>

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-warning text-dark fw-bold">
                  🎵 Enviar Mensaje
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
