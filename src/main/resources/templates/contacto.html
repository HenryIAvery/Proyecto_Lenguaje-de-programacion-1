<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tienda ITQ - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white p-5">

    <div class="container">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-info">TIENDITA ITQ</h1>
            <p class="lead text-secondary">¿Tienes dudas o necesitas asistencia técnica?</p>
            <nav class="d-flex justify-content-center gap-3 mt-3">
                <a th:href="@{/}" class="btn btn-outline-light btn-sm">Inicio</a>
                <a th:href="@{/categorias}" class="btn btn-outline-light btn-sm">Categorías</a>
                <a th:href="@{/ofertas}" class="btn btn-outline-light btn-sm">Ofertas Exclusivas</a>
                <a th:href="@{/contacto}" class="btn btn-info btn-sm text-dark fw-bold">Contáctanos</a>
                <a th:href="@{/carrito}" class="btn btn-outline-warning btn-sm">Mi Carrito 🛒</a>
            </nav>
            <hr class="border-info">
        </header>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-secondary text-white border-0 shadow p-4">
                    <h3 class="mb-4 text-center text-info fw-bold">📬 Mensajería Soporte ITQ</h3>

                    <div th:if="${mensajeExito}"
                        class="alert alert-success bg-dark text-success border-success text-center fw-bold mb-3"
                        th:text="${mensajeExito}"></div>
                    <div th:if="${error}"
                        class="alert alert-danger bg-dark text-danger border-danger text-center small mb-3"
                        th:text="${error}"></div>

                    <form th:action="@{/contacto/enviar}" th:object="${contacto}" method="POST">
                        <div class="mb-3">
                            <label for="nombre" class="form-label small fw-bold text-info">Nombre:</label>
                            <input type="text" th:field="*{nombre}"
                                class="form-control bg-dark text-white border-secondary" id="nombre"
                                placeholder="Tu nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label small fw-bold text-info">Correo Electrónico:</label>
                            <input type="email" th:field="*{correo}"
                                class="form-control bg-dark text-white border-secondary" id="correo"
                                placeholder="usuario@itq.edu.ec" required>
                        </div>
                        <div class="mb-3">
                            <label for="asunto" class="form-label small fw-bold text-info">Asunto:</label>
                            <input type="text" th:field="*{asunto}"
                                class="form-control bg-dark text-white border-secondary" id="asunto"
                                placeholder="Ej: Consulta de stock" required>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label small fw-bold text-info">Detalle:</label>
                            <textarea th:field="*{mensaje}" class="form-control bg-dark text-white border-secondary"
                                id="mensaje" rows="4" placeholder="Escribe aquí tu mensaje..." required></textarea>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-info fw-bold text-dark">Enviar Mensaje a Soporte
                                🚀</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
