<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Vinyl House - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light p-5">

```
<div class="container">

    <!-- ENCABEZADO -->
    <header class="text-center mb-5">

        <h1 class="display-4 fw-bold text-warning">
            🎵 VINYL HOUSE
        </h1>

        <p class="lead text-light" th:if="${usuarioLogueado == null}">
            Descubre álbumes legendarios en CD, Vinilo y Ediciones Coleccionista
        </p>

        <p class="lead text-success fw-bold" th:if="${usuarioLogueado != null}"
            th:text="'¡Bienvenido, ' + ${usuarioLogueado.nombre} + '! 🎶'">
        </p>

        <nav class="d-flex justify-content-center gap-3 mt-4 flex-wrap">

            <a th:href="@{/}" class="btn btn-warning btn-sm text-dark fw-bold">
                Inicio
            </a>

            <a th:ref="@{/catalogo}" class="btn btn-outline-light btn-sm">
                Catálogo
            </a>


            <a th:href="@{/categorias}" class="btn btn-outline-light btn-sm">
                Categorías
            </a>

            <a th:href="@{/ofertas}" class="btn btn-outline-light btn-sm">
                Ofertas
            </a>

            <a th:href="@{/contacto}" class="btn btn-outline-light btn-sm">
                Contacto
            </a>

            <a th:href="@{/carrito}" class="btn btn-outline-warning btn-sm">
                Mi Carrito 🛒
            </a>

            <a th:href="@{/historial}" class="btn btn-outline-info btn-sm"
                th:if="${usuarioLogueado != null}">
                Mis Compras
            </a>

            <a th:if="${usuarioLogueado == null}"
                th:href="@{/login}"
                class="btn btn-outline-success btn-sm">
                Iniciar Sesión
            </a>

            <a th:if="${usuarioLogueado != null}"
                th:href="@{/logout}"
                class="btn btn-outline-danger btn-sm">
                Cerrar Sesión
            </a>

        </nav>

        <hr class="border-warning mt-4">

    </header>

    <!-- MENSAJE -->
    <div th:if="${mensajeExito}"
        class="alert alert-success text-center fw-bold"
        th:text="${mensajeExito}">
    </div>

    <!-- TÍTULO CATÁLOGO -->
    <h2 class="text-warning mb-4"
        th:text="${categoriaSeleccionada != null} ?
        'Categoría: ' + ${categoriaSeleccionada} :
        'Catálogo Musical'">
    </h2>

    <!-- PRODUCTOS -->
    <div class="row row-cols-1 row-cols-md-3 g-4">

        <div class="col" th:each="producto : ${productos}">

            <div class="card bg-secondary text-white h-100 border-0 shadow">

                <!-- PORTADA -->
                <img th:src="${producto.imagenUrl}"
                    class="card-img-top"
                    alt="Portada del álbum"
                    style="height: 280px; width: 100%; object-fit: cover;">

                <div class="card-body d-flex flex-column">

                    <!-- NOMBRE -->
                    <h5 class="card-title text-warning fw-bold"
                        th:text="${producto.nombre}">
                        Nombre Álbum
                    </h5>

                    <!-- ARTISTA -->
                    <p class="mb-2">
                        <strong>🎤 Artista:</strong>
                        <span th:text="${producto.artista}"></span>
                    </p>

                    <!-- SLOGAN -->
                    <p class="fst-italic text-light opacity-75"
                        th:text="${producto.slogan}">
                    </p>

                    <!-- DESCRIPCIÓN -->
                    <p class="card-text small flex-grow-1"
                        th:text="${producto.descripcion}">
                    </p>

                    <!-- CATEGORÍA -->
                    <div class="mb-3">

                        <span class="badge bg-warning text-dark fw-bold"
                            th:text="${producto.categoria.nombre}">
                            Categoría
                        </span>

                        <span class="badge bg-dark border border-light ms-2"
                            th:if="${producto.enOferta}">
                            🔥 Oferta
                        </span>

                    </div>

                    <!-- PRECIO Y STOCK -->
                    <div class="d-flex justify-content-between align-items-center">

                        <span class="fs-4 fw-bold text-warning"
                            th:text="'$' + ${producto.precio}">
                        </span>

                        <span class="small text-light"
                            th:text="'Stock: ' + ${producto.cantidad}">
                        </span>

                    </div>

                </div>

                <!-- BOTÓN -->
                <div class="card-footer bg-transparent border-0 p-3">

                    <div class="d-grid">

                        <a th:href="@{/carrito/agregar/{id}(id=${producto.id})}"
                            class="btn btn-warning text-dark fw-bold">

                            🛒 Añadir al Carrito

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
```

</body>

</html>
