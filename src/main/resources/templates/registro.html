<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tienda ITQ - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white p-5">

    <div class="container">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-info">TIENDITA ITQ</h1>
            <p class="lead text-secondary">Crear Nueva Cuenta de Usuario</p>
            <nav class="d-flex justify-content-center gap-3 mt-3">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Regresar al Login</a>
            </nav>
            <hr class="border-info">
        </header>

        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card bg-secondary text-white border-0 shadow p-4">
                    <h3 class="mb-4 text-center text-info fw-bold">📝 Formulario de Registro</h3>

                    <div th:if="${error}"
                        class="alert alert-danger bg-dark text-danger border-danger text-center small mb-3"
                        th:text="${error}"></div>

                    <form th:action="@{/registro}" method="POST">
                        <div class="mb-3">
                            <label for="nombre" class="form-label small fw-bold text-info">Nombre Completo:</label>
                            <input type="text" name="nombre" class="form-control bg-dark text-white border-secondary"
                                id="nombre" placeholder="Nombre Apellido" required>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label small fw-bold text-info">Correo Electrónico:</label>
                            <input type="email" name="correo" class="form-control bg-dark text-white border-secondary"
                                id="correo" placeholder="correo@itq.edu.ec" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-bold text-info">Contraseña de
                                Acceso:</label>
                            <input type="password" name="password"
                                class="form-control bg-dark text-white border-secondary" id="password"
                                placeholder="••••••••" required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success fw-bold text-dark">Registrarse 💾</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
