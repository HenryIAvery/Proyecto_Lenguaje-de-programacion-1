<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tienda ITQ - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white p-5">

    <div class="container">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-info">TIENDITA ITQ</h1>
            <p class="lead text-secondary">Ingreso de Clientes Autorizados</p>
            <nav class="d-flex justify-content-center gap-3 mt-3">
                <a th:href="@{/}" class="btn btn-outline-light btn-sm">Regresar al Catálogo</a>
                <a th:href="@{/registro}" class="btn btn-link btn-sm text-info text-decoration-none">¿No tienes cuenta?
                    Regístrate aquí</a>
            </nav>
            <hr class="border-info">
        </header>

        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card bg-secondary text-white border-0 shadow p-4">
                    <h3 class="mb-4 text-center text-info fw-bold">🔑 Iniciar Sesión</h3>

                    <div th:if="${error}"
                        class="alert alert-danger bg-dark text-danger border-danger text-center small mb-3"
                        th:text="${error}"></div>
                    <div th:if="${mensajeExito}"
                        class="alert alert-success bg-dark text-success border-success text-center small mb-3"
                        th:text="${mensajeExito}"></div>

                    <form th:action="@{/login}" method="POST">
                        <div class="mb-3">
                            <label for="correo" class="form-label small fw-bold text-info">Correo Electrónico:</label>
                            <input type="email" name="correo" class="form-control bg-dark text-white border-secondary"
                                id="correo" placeholder="ejemplo@itq.edu.ec" required>
                        </div>
                        <div class="mb-3">
                            <label interpreter="text" for="password"
                                class="form-label small fw-bold text-info">Contraseña:</label>
                            <input type="password" name="password"
                                class="form-control bg-dark text-white border-secondary" id="password"
                                placeholder="••••••••" required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-info fw-bold text-dark">Ingresar al Sistema</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
