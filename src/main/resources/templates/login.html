<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Vinyl House - Iniciar Sesión</title>
    <link rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/estilos.css}" />
  </head>

  <body class="bg-dark text-white p-5">
    <div class="container">
      <!-- HEADER -->

      <header class="text-center mb-5">
        <h1 class="display-4 fw-bold text-warning">🎵 VINYL HOUSE</h1>

        <p class="lead text-light">
          Accede a tu colección y administra tus compras
        </p>

        <nav class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
          <a th:href="@{/}" class="btn btn-outline-light btn-sm">
            Volver al Inicio
          </a>

          <a th:href="@{/registro}" class="btn btn-outline-warning btn-sm">
            Crear Cuenta
          </a>
        </nav>

        <hr class="border-warning mt-4" />
      </header>

      <!-- LOGIN -->

      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card bg-secondary text-white border-0 shadow p-4">
            <h3 class="mb-4 text-center text-warning fw-bold">
              🔑 Iniciar Sesión
            </h3>

            <p class="text-center text-light opacity-75 mb-4">
              Inicia sesión para completar compras y consultar tu historial.
            </p>

            <!-- MENSAJES -->

            <div
              th:if="${error}"
              class="alert alert-danger text-center"
              th:text="${error}"
            ></div>

            <div
              th:if="${mensajeExito}"
              class="alert alert-success text-center"
              th:text="${mensajeExito}"
            ></div>

            <!-- FORMULARIO -->

            <form th:action="@{/login}" method="POST">
              <div class="mb-3">
                <label for="correo" class="form-label fw-bold text-warning">
                  Correo Electrónico
                </label>

                <input
                  type="email"
                  name="correo"
                  id="correo"
                  class="form-control bg-dark text-white border-secondary"
                  placeholder="ejemplo@email.com"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-bold text-warning">
                  Contraseña
                </label>

                <input
                  type="password"
                  name="password"
                  id="password"
                  class="form-control bg-dark text-white border-secondary"
                  placeholder="••••••••"
                  required
                />
              </div>

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-warning text-dark fw-bold">
                  Entrar a Vinyl House 🎵
                </button>
              </div>
            </form>

            <hr class="border-light my-4" />

            <p class="text-center mb-0">
              ¿Aún no tienes cuenta?

              <a
                th:href="@{/registro}"
                class="text-warning fw-bold text-decoration-none"
              >
                Regístrate aquí
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
