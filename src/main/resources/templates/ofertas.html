<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Vinyl House - Ofertas Especiales</title>
    <link rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">v
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/estilos.css}" />
  </head>

  <body class="bg-dark text-white p-5">
    <div class="container">
      <!-- HEADER -->
      <header class="text-center mb-5">
        <h1 class="display-4 fw-bold text-warning">🎵 VINYL HOUSE</h1>

        <p class="lead text-danger fw-bold">
          🔥 OFERTAS ESPECIALES DE LA SEMANA 🔥
        </p>

        <nav class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
          <a th:href="@{/}" class="btn btn-outline-light btn-sm"> Inicio </a>

          <a th:href="@{/catalogo}" class="btn btn-outline-light btn-sm">
            Catálogo
          </a>

          <a th:href="@{/categorias}" class="btn btn-outline-light btn-sm">
            Categorías
          </a>

          <a
            th:href="@{/ofertas}"
            class="btn btn-warning btn-sm text-dark fw-bold"
          >
            Ofertas
          </a>

          <a th:href="@{/contacto}" class="btn btn-outline-light btn-sm">
            Contacto
          </a>

          <a th:href="@{/carrito}" class="btn btn-outline-warning btn-sm">
            Mi Carrito 🛒
          </a>
        </nav>

        <hr class="border-warning mt-4" />
      </header>

      <!-- MENSAJE -->

      <div
        th:if="${mensajeExito}"
        class="alert alert-success text-center fw-bold"
        th:text="${mensajeExito}"
      ></div>

      <!-- TÍTULO -->

      <div class="text-center mb-5">
        <h2 class="text-warning fw-bold">Álbumes en Promoción</h2>

        <p class="text-light opacity-75">
          Aprovecha descuentos exclusivos en una selección de álbumes.
        </p>
      </div>

      <!-- PRODUCTOS -->

      <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="producto : ${productos}">
          <div
            class="card bg-secondary text-white h-100 border-0 shadow position-relative"
          >
            <!-- DESCUENTO -->

            <span
              class="position-absolute top-0 start-0 m-3 badge bg-danger fs-6 shadow"
              th:text="'-' + ${producto.descuento} + '% OFF'"
            >
            </span>

            <!-- PORTADA -->

            <img
              th:src="@{${producto.imagenUrl}}"
              class="card-img-top mt-4"
              alt="Portada"
              style="height: 280px; width: 100%; object-fit: cover"
            />

            <div class="card-body d-flex flex-column">
              <!-- CATEGORÍA -->

              <div class="mb-2">
                <span
                  class="badge bg-warning text-dark fw-bold"
                  th:text="${producto.categoria.nombre}"
                >
                </span>
              </div>

              <!-- NOMBRE -->

              <h5
                class="card-title text-warning fw-bold"
                th:text="${producto.nombre}"
              ></h5>

              <!-- ARTISTA -->

              <p class="mb-2">
                <strong>🎤 Artista:</strong>

                <span th:text="${producto.artista}"> </span>
              </p>

              <!-- SLOGAN -->

              <p class="fst-italic opacity-75" th:text="${producto.slogan}"></p>

              <!-- DESCRIPCIÓN -->

              <p
                class="small flex-grow-1"
                th:text="${producto.descripcion}"
              ></p>

              <!-- PRECIOS -->

              <div class="mt-3">
                <div
                  class="text-decoration-line-through text-light opacity-50"
                  th:text="'$' + ${producto.precio}"
                ></div>

                <div
                  class="fs-4 fw-bold text-warning"
                  th:text="'$' + ${producto.precioEfectivo}"
                ></div>
              </div>
            </div>

            <!-- BOTÓN -->

            <div class="card-footer bg-transparent border-0 p-3">
              <div class="d-grid">
                <form th:action="@{/carrito/agregar}" method="POST">
                  <input type="hidden" name="id" th:value="${producto.id}" />

                  <div class="d-grid">
                    <button type="submit" class="btn btn-danger fw-bold">
                      🔥 Aprovechar Oferta
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
